# Production stack. Only Nginx (the frontend container) is published to the host;
# Postgres, Redis and the API are reachable only on the internal Docker network.
#
#   docker compose up -d --build
#
# For local development with hot reload, add the dev overlay:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: genai_engine
      POSTGRES_USER: genai_engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genai_engine -d genai_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://genai_engine:${POSTGRES_PASSWORD}@postgres:5432/genai_engine
      REDIS_URL: redis://redis:6379/0
      USE_FAKE_REDIS: "false"
      FAISS_INDEX_DIR: /app/data/faiss
      WORKSPACE_DIR: /app/data/workspace
    volumes:
      - faiss_data:/app/data/faiss
      - workspace_data:/app/data/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  faiss_data:
  workspace_data:
